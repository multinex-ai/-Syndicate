[package]
name = "syndicate-gpu-worker"
version = "0.2.0"
edition = "2021"
description = "Compiled Rust GPU worker supervisor for Runpod Serverless and HTTP inference with low-memory Metal/Vulkan/CUDA tiering"

[dependencies]
syndicate-gpu-lowmem = { path = "../gpu-lowmem" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
libc = "0.2.183"
sha2 = "0.10.9"
hex = "0.4.3"
base64 = "0.22.1"
